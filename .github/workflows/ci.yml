name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          # Pinned rather than ubuntu-latest: the label is migrating from 24.04
          # to 26.04 between 2026-10-19 and 2026-11-19, so runs can otherwise
          # land on different images with different Ruby versions available.
          # https://github.com/actions/runner-images/issues/14748
          - ubuntu-24.04
          # Pinned for the same reason. macOS exercises the Socket/OpenSSL and
          # Net::HTTP paths used by the DoT and DoH transports.
          - macos-15
        ruby:
          - '3.3.14' # minimum supported version
          - '3.4.13'
          - '4.0.10'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Check action pinning
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        if: runner.os == 'Linux'
        with:
          fix: 'false'

      # Must run under bundler: on CI the gems live in vendor/bundle, so a
      # bare `ruby` cannot resolve `nokogiri`.
      - name: Load with warnings enabled
        run: |
          bundle exec ruby -w -e 'require "dmarcator"' 2> warnings.log
          if grep -q 'dmarcator' warnings.log; then
            echo '::error::dmarcator emitted warnings'
            cat warnings.log
            exit 1
          fi

      - name: Check documentation
        if: runner.os == 'Linux'
        run: bundle exec yard doc --no-output --fail-on-warning

      - name: Build gem
        run: gem build dmarc.gemspec

      - name: Smoke-test the built gem
        run: |
          gem unpack dmarcator-*.gem --target "$RUNNER_TEMP"
          bundle exec ruby -I "$RUNNER_TEMP"/dmarcator-*/lib \
            -e 'require "dmarcator"; abort "missing VERSION" unless DMARCator::VERSION'

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.3.14'
          bundler-cache: true

      - name: Audit dependencies
        run: bundle exec bundler-audit check --update

  minimum-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      BUNDLE_GEMFILE: gemfiles/minimum.gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.3.14'
          bundler-cache: true

      - name: Run specs against the minimum nokogiri
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.3.14'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
